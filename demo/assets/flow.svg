<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="sel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1180" height="560" fill="#f5f5f7"/>

  <!-- ============ step 1: Finder context menu ============ -->
  <text x="40" y="42" font-size="15" font-weight="600" fill="#1d1d1f">1 · Right-click the document in Finder</text>

  <g filter="url(#sh)">
    <rect x="40" y="62" width="300" height="252" rx="10" fill="#f7f7f7" stroke="#d7d7d9"/>
  </g>
  <text x="60" y="90" font-size="13.5" fill="#1d1d1f">Open</text>
  <text x="60" y="116" font-size="13.5" fill="#1d1d1f">Open With</text>
  <text x="322" y="116" font-size="13.5" fill="#8a8a8e">›</text>
  <line x1="52" y1="132" x2="328" y2="132" stroke="#e2e2e4"/>
  <text x="60" y="156" font-size="13.5" fill="#1d1d1f">Get Info</text>
  <text x="60" y="182" font-size="13.5" fill="#1d1d1f">Rename</text>
  <text x="60" y="208" font-size="13.5" fill="#1d1d1f">Duplicate</text>
  <line x1="52" y1="224" x2="328" y2="224" stroke="#e2e2e4"/>
  <text x="60" y="248" font-size="13.5" fill="#1d1d1f">Quick Actions</text>
  <text x="322" y="248" font-size="13.5" fill="#8a8a8e">›</text>
  <!-- highlighted Services row -->
  <rect x="46" y="258" width="288" height="28" rx="5" fill="url(#sel)"/>
  <text x="60" y="277" font-size="13.5" fill="#fff" font-weight="500">Services</text>
  <text x="322" y="277" font-size="13.5" fill="#fff">›</text>

  <!-- Services submenu -->
  <g filter="url(#sh)">
    <rect x="344" y="248" width="252" height="48" rx="10" fill="#f7f7f7" stroke="#d7d7d9"/>
  </g>
  <rect x="350" y="254" width="240" height="28" rx="5" fill="url(#sel)"/>
  <text x="364" y="273" font-size="13.5" fill="#fff" font-weight="500">Compare Versions</text>

  <!-- ============ step 2: version picker ============ -->
  <text x="640" y="42" font-size="15" font-weight="600" fill="#1d1d1f">2 · Pick two versions from the git history</text>

  <g filter="url(#sh)">
    <rect x="640" y="62" width="500" height="252" rx="12" fill="#fff" stroke="#d7d7d9"/>
    <rect x="640" y="62" width="500" height="38" rx="12" fill="#ececee"/>
    <rect x="640" y="88" width="500" height="12" fill="#ececee"/>
  </g>
  <circle cx="662" cy="81" r="6" fill="#ff5f57"/><circle cx="681" cy="81" r="6" fill="#febc2e"/><circle cx="700" cy="81" r="6" fill="#28c840"/>
  <text x="890" y="86" font-size="13" font-weight="600" fill="#3c3c43" text-anchor="middle">Compare Versions</text>

  <text x="664" y="126" font-size="13" fill="#1d1d1f">Mutual-NDA-Northwind-Contoso.docx</text>
  <text x="664" y="152" font-size="12.5" fill="#6e6e73">Select two versions. The older one is treated as the original.</text>

  <rect x="664" y="166" width="452" height="96" rx="6" fill="#fff" stroke="#c7c7cc"/>
  <rect x="665" y="167" width="450" height="30" fill="url(#sel)"/>
  <text x="674" y="187" font-size="11.5" fill="#fff">Feb 14, 2026 — NDA: first markup — make it mutual, 3-year term…</text>
  <rect x="665" y="197" width="450" height="30" fill="url(#sel)"/>
  <text x="674" y="217" font-size="11.5" fill="#fff">Feb 11, 2026 — NDA: Contoso's standard form as received</text>
  <text x="674" y="247" font-size="11.5" fill="#1d1d1f">Mar 4, 2026 — NDA: notice addresses and signature blocks…</text>

  <rect x="936" y="274" width="82" height="26" rx="6" fill="#fff" stroke="#c7c7cc"/>
  <text x="977" y="291" font-size="12.5" fill="#1d1d1f" text-anchor="middle">Cancel</text>
  <rect x="1028" y="274" width="88" height="26" rx="6" fill="#2563eb"/>
  <text x="1072" y="291" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="500">Compare</text>

  <!-- ============ step 3 ============ -->
  <text x="40" y="372" font-size="15" font-weight="600" fill="#1d1d1f">3 · Word's own redline opens, next to the original</text>

  <g filter="url(#sh)">
    <rect x="40" y="392" width="1100" height="132" rx="10" fill="#fff" stroke="#d7d7d9"/>
  </g>
  <line x1="66" y1="410" x2="66" y2="508" stroke="#8a8a8e" stroke-width="1.5"/>
  <text x="84" y="426" font-size="13" fill="#1d1d1f" font-family="Times New Roman, Times, serif">
    <tspan font-weight="bold">3. Term. </tspan><tspan>This Agreement shall remain in effect for </tspan><tspan fill="#b8860b" text-decoration="underline">three (3)</tspan><tspan fill="#b8860b" text-decoration="line-through">five (5)</tspan><tspan> years from the </tspan><tspan fill="#b8860b" text-decoration="underline">Effective Date.</tspan>
  </text>
  <text x="84" y="452" font-size="13" fill="#1d1d1f" font-family="Times New Roman, Times, serif">
    <tspan fill="#b8860b" text-decoration="line-through">date of last signature. Recipient's</tspan><tspan> obligations with respect to Confidential Information shall</tspan>
  </text>
  <text x="84" y="478" font-size="13" fill="#1d1d1f" font-family="Times New Roman, Times, serif">
    <tspan fill="#b8860b" text-decoration="underline">continue for three (3) years following disclosure</tspan><tspan fill="#b8860b" text-decoration="line-through">survive indefinitely</tspan><tspan>.</tspan>
  </text>
  <text x="84" y="504" font-size="11.5" fill="#6e6e73">26 insertions, 23 deletions — real Word tracked changes, ready to accept or reject.</text>

  <text x="1140" y="548" font-size="10.5" fill="#aeaeb2" text-anchor="end">Illustration of the interface, not a screen capture.</text>
</svg>
